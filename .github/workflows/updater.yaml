name: PROXY Updater
on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches:
      - main
    paths:
      - 'http.txt'
      - 'socks4.txt'
      - 'socks5.txt'
      - 'LATEST_UPDATE'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install requests
      - name: Send Latest Update and Files to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: |
          python -c "
          import os, requests

          bot_token = os.environ.get('BOT_TOKEN')
          chat_ids = [os.environ.get('CHAT_ID'), os.environ.get('GROUP_ID')]

          if not bot_token:
              print('Error: BOT_TOKEN missing!')
              exit(1)

          for chat_id in chat_ids:
              if not chat_id:
                  continue
              
              print(f'Sending to Chat ID: {chat_id}')

              # 1. LATEST_UPDATE ပါ စာသားများကို အရင်ဆုံး Message အဖြစ် ပို့ခြင်း
              if os.path.exists('LATEST_UPDATE'):
                  with open('LATEST_UPDATE', 'r', encoding='utf-8') as f:
                      latest_content = f.read()
                      message_text = f'🕒 **Latest Update:**\n{latest_content}'
                      msg_url = f'https://api.telegram.org/bot{bot_token}/sendMessage'
                      requests.post(msg_url, data={'chat_id': chat_id, 'text': message_text, 'parse_mode': 'Markdown'})

              # 2. ကျန်ရှိသော Proxy ဖိုင်များကို LATEST_UPDATE နောက်မှ ဆက်၍ ပို့ခြင်း
              files = ['http.txt', 'socks4.txt', 'socks5.txt']
              for file_name in files:
                  if os.path.exists(file_name):
                      with open(file_name, 'rb') as f:
                          url = f'https://api.telegram.org/bot{bot_token}/sendDocument'
                          response = requests.post(url, data={'chat_id': chat_id}, files={'document': f})
                          print(f'Sending {file_name} to {chat_id}: {response.status_code}')
          "
