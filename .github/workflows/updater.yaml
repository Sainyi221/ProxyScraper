name: PROXY Updater
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        required: true
        default: warning
        type: choice
        options:
          - info
          - warning
          - debug
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install requests
      - name: Scrape and Send Proxy Files to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -c "
          import os, requests

          bot_token = os.environ.get('BOT_TOKEN')
          chat_id = os.environ.get('CHAT_ID')

          if not bot_token or not chat_id:
              print('Error: BOT_TOKEN or CHAT_ID missing!')
              exit(1)

          # Proxy များကို Free sources များမှ ရယူခြင်း (ဥပမာ API များကို အသုံးပြုနိုင်သည်)
          # သို့မဟုတ် လက်ရှိ repository ထဲတွင် ဖိုင်များရှိပါက ၎င်းတို့ကို ပို့ပါမည်
          files = ['http.txt', 'socks4.txt', 'socks5.txt']
          
          for file_name in files:
              if os.path.exists(file_name):
                  with open(file_name, 'rb') as f:
                      url = f'https://api.telegram.org/bot{bot_token}/sendDocument'
                      response = requests.post(url, data={'chat_id': chat_id}, files={'document': f})
                      print(f'Sending {file_name}: {response.status_code}')
              else:
                  print(f'{file_name} not found locally.')
          "
